# verif/plan.toml - 검증 계획 데이터의 원본 (vplan, 가설, 버그, waiver, 승인된 RTL)
#
# 이 파일만 고칩니다. verif/vplan/vplan.md는 여기서 생성합니다:
#   python scripts/plan_check.py --write     # vplan.md 다시 생성
#   python scripts/plan_check.py             # 서로 맞는지 검사 (sign-off S2, S9가 이 결과를 씀)
#
# features.tests  : "<tb>/<test>". tb 자리에 *를 쓰면 그 테스트가 있는 모든 TB (테스트 이름에는 * 금지)
# features.checks : scripts/check_inventory.py의 검사 ID (uvm_error 태그, SVA:<라벨>)
# features.covers : 커버포인트 "<covergroup>.<coverpoint>". verif/regress_plan.json의 목표 bin에 있어야 함
# status          : planned | in_progress | done | blocked (blocked면 bug 또는 hypothesis 필요)
# *_text          : vplan.md 표에 보이는 글 (사람이 읽는 설명)

schema = 1
title = "검증 계획 (계속 갱신하는 문서)"
legend = "표시: ✅ 완료 · 🚧 진행 중 · ⬜ 계획 · ❌ 버그로 막힘"

[rtl]
# HW/ 내용 해시 (scripts/common.py hw_hash). RTL이 바뀌면 sign-off가 FAIL하고, 사람이 확인한 뒤 갱신합니다.
approved_hw_hash = "9fdca2f0cc594a65"
approved_on = "2026-11-14"
note = "HW/는 9627972(2026-11-14) 이후 바뀌지 않음"

[smoke]
# 계획 없이 도는 smoke의 top 테스트 (Jenkinsfile과 scripts/ml_regress.py가 여기서 읽음)
top_tests = [
  "dma_reg_reset_test",
  "dma_reg_bitbash_test",
  "dma_smoke_test",
  "dma_short_job_test",
  "dma_irq_test",
  "dma_aw_backpressure_test",
  "dma_checker_test",
]

[[sections]]
id = "unit"
heading = "P1: 단위 레벨 (`verif/unit`, `unit_env_pkg`, `unit_test_pkg`)"
preamble = []
columns = ["기능", "블록", "테스트", "검사", "커버리지", "상태"]

[[sections]]
id = "top"
heading = "P2: top 레벨 `dma_ip_top` (`verif/top`, `dma_env_pkg`, `dma_seq_pkg`, `dma_test_pkg`)"
preamble = [
  "env: AXI4-Lite master (`axil_agent` + `axil_monitor`) → DUT → AXI4 slave agent + 메모리 모델 (`axi4_slave_pkg`). 레지스터는 RAL(`dma_reg_block`, frontdoor는 `axil_reg_adapter`), 검사는 `dma_predictor`(모든 AXI-Lite 읽기와 interrupt 핀 예측, start 순간에 job 생성) + `dma_scoreboard`(모니터 기반: AR/AW 목록, W beat, 마지막 B 뒤 메모리).",
  "작업마다: `dma_job_vseq`가 `SW/mem_copy_test.c`와 같은 순서로 레지스터를 설정하고, 시작하고, 완료(polling 또는 IRQ)를 기다립니다. 판정은 monitor가 본 것으로 `dma_predictor`와 `dma_scoreboard`가 합니다.",
]
columns = ["기능", "테스트", "검사", "커버리지", "상태"]

