# 로컬 dma-uvm CI의 Jenkins Configuration as Code.
# ${VARS}는 시작할 때 ci/start-jenkins.ps1이 넣어 줌. 이 파일에는 비밀값이 없음.
jenkins:
  systemMessage: "dma-uvm CI: UVM regression of dma_ip on Vivado XSim (local PC)"
  numExecutors: 1            # 빌드는 한 번에 하나. 병렬 실행은 빌드 안에서 regress.py가 함
  labelString: "vivado"
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: "PYTHON"
            value: "${PYTHON_EXE}"
          - key: "XILINX_VIVADO"
            value: "${XILINX_VIVADO}"
          - key: "REGRESS_JOBS"
            value: "${REGRESS_JOBS}"

# `tool: git:` 블록 없음: Jenkins는 기본 설치(PATH의 "git")를 사용.
# 예전에 `home: "${GIT_EXE}"` 항목이 치환되지 않고 글자 그대로 저장돼서,
# SCM poll마다 "Selected Git installation does not exist" 경고가 났음.

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub 토큰 (시작할 때 `gh auth token`으로 가져옴)"

unclassified:
  location:
    url: "http://localhost:${JENKINS_PORT}/"

jobs:
  - script: >
      pipelineJob('dma-uvm') {
        description('dma_ip UVM 회귀 (Vivado 2022.2 XSim). main에 push: smoke. 매일 02:00: full.')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM { scmpoll_spec('H/5 * * * *') }
              cron { spec('H 2 * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/${GITHUB_REPO}.git')
                  credentials('github')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
